name: CI (Meson C Library)

on:
  push:
    branches: 
      - main
  pull_request:
    branches: 
      - main

jobs:
  build-test:
    # Linux with GCC and macOS with Apple clang. Windows is not supported yet:
    # M_PI, jn() and the stderr capture in tests/utils are POSIX-only, and a
    # DLL needs explicit symbol export.
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      BUILD_DIR: builddir

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python (Meson/Ninja need Python)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Only the header-only Boost.Math special functions are used, so the
      # headers alone are enough on both platforms.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libboost-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja boost

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson pytest

      # --------------------------
      # Configure, build, test
      # --------------------------
      - name: Configure (meson setup)
        run: meson setup "$BUILD_DIR" --backend ninja -Dtests=true

      - name: Build (meson compile)
        run: meson compile -C "$BUILD_DIR"

      - name: Install libhankel
        run: |
          python -m pip install -e .

      - name: Run pytest
        run: |
          pytest -v

      - name: Test (meson test)
        run: meson test -C "$BUILD_DIR" --print-errorlogs
